<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Juega a piedra, papel o tijera contra la máquina.">
    <title>Piedra, papel o tijera</title>
    <link rel="stylesheet" href="../css/piedra-papel-tijera.css">
    <link rel="stylesheet" href="../css/tema.css">
    <script src="../js/tema.js" defer></script>
    <script src="../js/piedra-papel-tijera.js" defer></script>
</head>
<body>
    <main class="juego">
        <a class="volver" href="../index.html">← Volver al inicio</a>
        <header class="encabezado">
            <p class="etiqueta">Un clásico de siempre</p>
            <h1>Piedra, papel o tijera</h1>
            <p>Elige tu jugada y descubre si puedes vencer a la máquina.</p>
        </header>

        <section class="partida" aria-label="Partida de piedra, papel o tijera">
            <div class="jugadores">
                <span>Tú</span>
                <span>Máquina</span>
            </div>
            <div class="arena" id="arena" aria-hidden="true">
                <span class="icono icono-jugador" id="icono-jugador">✊</span>
                <span class="icono icono-maquina" id="icono-maquina">✊</span>
            </div>
            <p class="resultado" id="resultado" role="status" aria-live="polite">
                Elige una opción para empezar.
            </p>
        </section>

        <section class="elecciones" aria-label="Elige tu jugada">
            <button type="button" class="boton-eleccion" data-eleccion="piedra">
                <span aria-hidden="true">✊</span>
                <span>Piedra</span>
            </button>
            <button type="button" class="boton-eleccion" data-eleccion="papel">
                <span aria-hidden="true">✋</span>
                <span>Papel</span>
            </button>
            <button type="button" class="boton-eleccion" data-eleccion="tijera">
                <span aria-hidden="true">✌️</span>
                <span>Tijera</span>
            </button>
        </section>
    </main>
</body>
</html>
